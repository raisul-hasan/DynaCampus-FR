detector:
  name: scrfd
  input_size: [640, 640]
  confidence_threshold: 0.50

recognizer:
  primary: insightface_arcface  # Verified first baseline; AdaFace remains future work.
  baseline: insightface_arcface
  secondary_comparison: facelivtv2_s
  input_size: [112, 112]
  embedding_dim: 512

adapter:
  enabled: true
  hidden_dim: 256
  dropout: 0.10

tracker:
  name: bytetrack
  track_buffer: 30
