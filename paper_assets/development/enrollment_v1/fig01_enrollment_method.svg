    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle" x="262.4" y="22.64" transform="rotate(-0 262.4 22.64)">Enrollment comparison: same frozen model, same probes</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #18242d" transform="translate(29.078281 91.266861)">One frontal photo</text>
