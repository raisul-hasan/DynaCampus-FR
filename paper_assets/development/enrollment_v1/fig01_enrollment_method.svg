    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #18242d" transform="translate(163.848555 238.096264)">ArcFace model</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #18242d" transform="translate(278.959766 211.496264)">Exact cosine search</text>
