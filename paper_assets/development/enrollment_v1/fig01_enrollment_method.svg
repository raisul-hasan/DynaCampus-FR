    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #18242d" transform="translate(21.14875 237.175952)">150 unknown probes</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #18242d" transform="translate(150.229414 210.575952)">Same preprocessing</text>
