    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #18242d" transform="translate(28.762852 117.866861)">unmasked photos</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #18242d" transform="translate(151.580195 91.266861)">SCRFD + alignment</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #18242d" transform="translate(163.072969 105.340962)">Frozen ArcFace</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #18242d" transform="translate(163.02918 118.787173)">512-D features</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #18242d" transform="translate(284.281992 92.187173)">Normalized mean</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #18242d" transform="translate(294.363125 105.487173)">of enrollment</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #18242d" transform="translate(306.576563 118.787173)">features</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(417.938242 91.237173)">55 enrolled IDs</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(415.620391 105.487173)">27 unknown IDs</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(410.264766 118.816861)">Development only</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #18242d" transform="translate(26.906641 211.496264)">Same 154 masked</text>
